<svg xmlns="http://www.w3.org/2000/svg" width="863" height="525" viewBox="0 0 863 525" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="13.5" role="img">
<title>sessionfarm</title>
<rect width="863" height="525" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0 10a10 10 0 0 1 10-10h843a10 10 0 0 1 10 10v26H0z" fill="#161b22"/>
<line x1="0" y1="36" x2="863" y2="36" stroke="#30363d"/>
<circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
<circle cx="39" cy="18" r="5.5" fill="#febc2e"/>
<circle cx="58" cy="18" r="5.5" fill="#28c840"/>
<text x="431.5" y="22.5" text-anchor="middle" fill="#8b949e" font-size="12">sessionfarm</text>
<text y="65.5" textLength="502.20" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">$ sessionfarm create client-b --notes &quot;client B, main account&quot;</tspan></text>
<text y="85.1" textLength="421.20" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">created client-b at ~/.sessionfarm/profiles/client-b</tspan></text>
<text y="124.2" textLength="153.90" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">$ sessionfarm serve</tspan></text>
<text y="143.8" textLength="372.60" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">sessionfarm listening on http://127.0.0.1:8787</tspan></text>
<text y="182.9" textLength="356.40" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9"># an agent takes a lease on the warm profile</tspan></text>
<text y="202.5" textLength="324.00" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">POST /profiles/client-b/acquire  -&gt;  200</tspan></text>
<text y="222.1" textLength="413.10" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">     leaseId   a8cf3a6a-e047-4b36-b70c-da727d02bc82</tspan></text>
<text y="241.7" textLength="502.20" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">     cdpUrl    ws://127.0.0.1:51445/devtools/browser/d3255b7f…</tspan></text>
<text y="280.8" textLength="486.00" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9"># it attaches over CDP and works in the already-open session</tspan></text>
<text y="300.4" textLength="356.40" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">connected. active page: https://example.com/</tspan></text>
<text y="339.6" textLength="340.20" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9"># a second agent asks for the same profile</tspan></text>
<text y="359.1" textLength="818.10" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">POST /profiles/client-b/acquire  -&gt;  409  profile &quot;client-b&quot; is leased until 2026-08-20T17:37:58.370Z</tspan></text>
<text y="398.3" textLength="477.90" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9"># agent-1 hands it back; agent-2 gets the same warm session</tspan></text>
<text y="417.8" textLength="202.50" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">localStorage.who  agent-1</tspan></text>
<text y="437.4" textLength="567.00" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">cookie auth       tok-xyz   &lt;- login state carried across the handover</tspan></text>
<text y="476.6" textLength="405.00" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">GET  /profiles/client-b/health   -&gt;  authenticated</tspan></text>
<text y="496.1" textLength="259.20" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">warm for 0.3s, leased by agent-2</tspan></text>
</svg>
